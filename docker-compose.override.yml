# Development overrides for docker-compose
# This file is automatically merged with docker-compose.yml in development

version: '3.8'

services:
  app:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - DEBUG=todo-api:*
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    stdin_open: true
    tty: true

  postgres:
    environment:
      - POSTGRES_DB=todo_db_dev
    ports:
      - "5433:5432"  # Different port to avoid conflicts